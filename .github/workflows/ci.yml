name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read   # minimum needed for actions/checkout on all jobs

jobs:
  # Build & Test — runs on every push and PR
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history to derive the version from git tags

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: ./build.sh --target=Build

      - name: Test
        run: dotnet test --nologo --logger "console;verbosity=normal"

  # Publish — self-contained binaries for CLI and Web
  # Runs on push to main and on tag pushes (not on PRs).
  publish:
    name: Publish (${{ matrix.rid }}, ${{ matrix.project }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # CLI builds
          - project: cli
            rid: linux-x64
            archive: tar
          - project: cli
            rid: linux-arm64
            archive: tar
          - project: cli
            rid: win-x64
            archive: zip
          - project: cli
            rid: osx-x64
            archive: tar
          - project: cli
            rid: osx-arm64
            archive: tar
          # Web builds
          - project: web
            rid: linux-x64
            archive: tar
          - project: web
            rid: win-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history to derive the version from git tags

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        run: |
          # On a tag push github.ref_name is the tag (e.g. v1.2.3); strip the leading 'v'.
          # On a branch push, derive a pre-release label from git describe.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(git describe --tags --long --abbrev=7 2>/dev/null \
              | sed -E 's/^v//; s/-([0-9]+)-g([0-9a-f]+)$/-alpha.\1+g\2/' \
              || echo "0.0.0-dev+g$(git rev-parse --short HEAD)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish CLI
        if: matrix.project == 'cli'
        run: ./build.sh --target=PublishCli --runtime=${{ matrix.rid }}

      - name: Publish Web
        if: matrix.project == 'web'
        run: ./build.sh --target=PublishWeb --runtime=${{ matrix.rid }}

      - name: Archive CLI (tar)
        if: matrix.project == 'cli' && matrix.archive == 'tar'
        run: |
          tar -czf compendium-cli-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz \
            -C bin/cli Compendium.Cli

      - name: Archive CLI (zip)
        if: matrix.project == 'cli' && matrix.archive == 'zip'
        run: |
          cd bin/cli
          zip ../../compendium-cli-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip Compendium.Cli.exe

      - name: Archive Web (tar)
        if: matrix.project == 'web' && matrix.archive == 'tar'
        run: |
          tar -czf compendium-web-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz \
            -C bin web

      - name: Archive Web (zip)
        if: matrix.project == 'web' && matrix.archive == 'zip'
        run: |
          cd bin
          zip -r ../compendium-web-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: compendium-${{ matrix.project }}-${{ matrix.rid }}
          path: compendium-${{ matrix.project }}-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.*
          retention-days: 30

  # Release — creates a GitHub release with all platform binaries.
  # Triggered only on v* tag pushes (e.g. v1.2.0).
  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
